services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: school_management_app
    volumes:
      - ./app:/var/www/html
    working_dir: /var/www/html
    ports:
      - "8080:80"
    environment:
      SERVER_NAME: ":80"
      APP_ENV: local
      APP_DEBUG: "1"
    depends_on:
      - db
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: school_management
      MYSQL_USER: school_user
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  dbdata:
